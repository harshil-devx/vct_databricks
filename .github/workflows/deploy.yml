name: Deploy — Production Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    # Configure "Required reviewers" on the 'production' GitHub Environment
    # (Settings -> Environments -> production) to enforce manual approval.
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Asset Bundle (prod)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle validate -t prod

      # Deploys prod pipeline + job (schedule stays PAUSED via var.schedule_pause_status).
      # Does NOT automatically trigger a prod run.
      - name: Deploy Databricks Asset Bundle (prod)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: databricks bundle deploy -t prod
