resources:
  pipelines:
    vct_medallion:
      name: vct-medallion
      catalog: ${var.catalog}
      schema: ${var.env_prefix}vct_bronze
      serverless: true
      continuous: false
      configuration:
        vct.landing_root: /Volumes/${var.catalog}/${var.landing_schema}/raw/vct
        vct.bronze_schema: ${var.catalog}.${var.env_prefix}vct_bronze
      libraries:
        - file:
            path: ../src/pipelines/bronze/bronze_overview.py