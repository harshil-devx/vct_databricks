# This is a Declarative Automation Bundle definition for vct_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: vct_pipeline
  uuid: c9839bec-6af8-4d03-b964-99911eb57165

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: Unity Catalog catalog for the project
  landing_schema:
    description: Schema that holds the raw landing volume (shared by all targets)
    default: vct_landing
  env_prefix:
    description: Prefix for the bronze/silver/gold schemas ("dev_" in dev, empty in prod)
    default: ""

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8805410b-e24b.cloud.databricks.com
    variables:
      catalog: final_project
      env_prefix: dev_
  prod:
    mode: production
    workspace:
      host: https://dbc-8805410b-e24b.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/harshil.devx@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/harshil.devx@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: final_project
    permissions:
      - user_name: harshil.devx@gmail.com
        level: CAN_MANAGE
